# Deploy the GridFS upload API (free tier) — https://render.com
# After deploy, set EXPO_GRIDFS_API_URL in app.json to https://<your-service>.onrender.com
services:
  - type: web
    name: aviora-gridfs-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/gridfsApi.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: aviora
      - key: GRIDFS_BUCKET_NAME
        value: request_documents
      - key: GRIDFS_API_KEY
        generateValue: true
      - key: GRIDFS_PUBLIC_BASE_URL
        sync: false
